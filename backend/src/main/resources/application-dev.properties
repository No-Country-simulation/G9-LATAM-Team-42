# =========================================================
# CONFIGURACION DE BASE DE DATOS EN MEMORIA (H2) - PRUEBAS LOCALES
# =========================================================
# Permite ejecutar y probar la persistencia e historial en entorno local sin requerir un servidor BD externo.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Permite ver la consola de H2 en el navegador en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console