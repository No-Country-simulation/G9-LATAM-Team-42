# Lee los valores desde las variables del servidor
spring.datasourse.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.url=jdbc:oracle:thin:@(description= (retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=${DB_PORT})(host=${DB_HOST}))(connect_data=(service_name=${DB_SERVICE_NAME}))(security=(ssl_server_dn_match=yes)))
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / Dialecto para Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update

# Le indica a Flyway que tome el estado actual de la BD como punto de partida (version 1)
spring.flyway.baseline-on-migrate=true

# (Opcional) Define la version inicial de la plantilla
spring.flyway.baseline-version=1